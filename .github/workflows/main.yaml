run-name: ${{ github.actor }} - ${{ github.ref_name }} ${{ github.sha }}

name: backend workflow

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:


jobs:
  ci-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: liberica
          cache: maven

      - name: Build application with Maven
        run: mvn --batch-mode --update-snapshots verify

  build-docker:
    if: github.event_name == 'push' && github.ref_name == 'main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: ci-test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ secrets.REPOSITORY_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deployment:
    needs: build-docker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: SCP Deployment
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "docker-compose-prod.yaml"
          target: "/home/${{ secrets.SSH_USERNAME }}"

      - name: .env Deployment
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            echo "POSTGRES_DB=${{ secrets.POSTGRES_DB }}" > /home/${{ secrets.SSH_USERNAME }}/.env
            echo "POSTGRES_USER=${{ secrets.POSTGRES_USER }}" >> /home/${{ secrets.SSH_USERNAME }}/.env
            echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> /home/${{ secrets.SSH_USERNAME }}/.env
            echo "POSTGRES_PORT=${{ secrets.POSTGRES_PORT }}" >> /home/${{ secrets.SSH_USERNAME }}/.env
            echo "REDIS_PORT=${{ secrets.REDIS_PORT }}" >> /home/${{ secrets.SSH_USERNAME }}/.env
            echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> /home/${{ secrets.SSH_USERNAME }}/.env
            echo "REPOSITORY_NAME=${{ secrets.REPOSITORY_NAME }}" >> /home/${{ secrets.SSH_USERNAME }}/.env
            echo "GITHUB_SHA=${{ github.sha }}" >> /home/${{ secrets.SSH_USERNAME }}/.env

      - name: Docker Compose Deployment
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd /home/${{ secrets.SSH_USERNAME }}
            docker compose down
            docker compose -f docker-compose-prod.yaml up -d --remove-orphans