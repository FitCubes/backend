spring.config.import=optional:file:.env[.properties],optional:file:\
  fit-cubes-backend/.env[.properties]

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:\
  ${POSTGRES_PORT:5432}/${POSTGRES_DB:fitcubes_db}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:secretpassword}

spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.open-in-view=false

spring.jpa.defer-datasource-initialization=false

spring.jpa.hibernate.ddl-auto=validate

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

spring.jpa.show-sql=true

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
