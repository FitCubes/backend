databaseChangeLog:
  - changeSet:
      id: 029-add-exercise-unit-consistency-check
      author: senjars
      changes:
        - sql:
            sql: >
              ALTER TABLE exercises ADD CONSTRAINT chk_exercise_unit_consistency
              CHECK (
                  (unit = 'MINUTES') OR
                  (unit IN ('REPS', 'STEPS') AND calories_per_unit IS NOT NULL)
              );
      rollback:
        - sql:
            sql: ALTER TABLE exercises DROP CONSTRAINT chk_exercise_unit_consistency;